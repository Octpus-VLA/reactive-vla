site_name: reactive-vla
site_description: Octpus VLA project — SO-101 imitation learning with lerobot
site_url: https://octpus-vla.github.io/reactive-vla/
repo_url: https://github.com/Octpus-VLA/reactive-vla
repo_name: Octpus-VLA/reactive-vla
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang:
        - ja
        - en
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            ホーム: Home
            はじめに: Getting Started
            セットアップ: Setup
            lerobot editable 構成: lerobot Editable Setup
            使い方ガイド: How-to Guides
            SmolVLA ファインチューニング: SmolVLA Fine-tuning
            RTC sim ロールアウト: RTC Sim Rollout
            sim スクリプトエキスパート収集: Sim Scripted Expert Collection
            研究ノート: Research Notes
            非同期レイテンシ実験（sync vs RTC）: Latency Experiments (sync vs RTC)
            overhead カメラ予測器による動的 pick: Overhead-Camera Predictor for Dynamic Pick

nav:
  - ホーム: index.md
  - はじめに:
      - セットアップ: setup.md
      - lerobot editable 構成: lerobot-editable-setup.md
  - 使い方ガイド:
      - SmolVLA ファインチューニング: smolvla-finetuning.md
      - RTC sim ロールアウト: rtc-sim-rollout.md
      - sim スクリプトエキスパート収集: sim-scripted-collect.md
  - 研究ノート:
      - 非同期レイテンシ実験（sync vs RTC）: latency-experiments.md
      - overhead カメラ予測器による動的 pick: overhead-predictor.md
